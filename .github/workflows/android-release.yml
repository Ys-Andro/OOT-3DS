name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'ports/android/**'
      - 'runtime/**'
      - 'tools/oot3d/native_game_runtime/**'
      - 'tools/android/**'
      - 'tools/triaevum_release/**'
      - 'scripts/build-android-*.sh'
      - 'CMakeLists.txt'
      - 'source.zip'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'ports/android/**'
      - 'runtime/**'
      - 'tools/oot3d/native_game_runtime/**'
      - 'tools/android/**'
      - 'tools/triaevum_release/**'
      - 'scripts/build-android-*.sh'
      - 'CMakeLists.txt'
      - 'source.zip'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Optional Release Tag override (e.g. v0.1.0)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark manual release as pre-release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# A main-branch update supersedes an older in-flight main build.
concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libvulkan-dev

      - name: Validate AOT source inventory and shutdown request
        run: |
          python3 -m unittest tools.triaevum_release.tests.test_translated_title_sources
          python3 -m unittest tools.triaevum_release.test_shutdown_request

      - name: Locate Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing Android NDK 27.2.12479018..."
            echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "Found Android NDK at: $NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: Extract Uploaded Shards
        run: |
          mkdir -p title-source
          if [ -f "source.zip" ]; then
            unzip source.zip -d ./title-source/
            if [ -d "./title-source/source" ]; then
              mv ./title-source/source/* ./title-source/
            fi
            echo "Shards extracted successfully."
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" != "true" ]; }; then
            echo "::warning::source.zip is absent; non-publishing validation may use a non-playable AOT stub."
          else
            echo "::error::Refusing a publishable build without verified translated title sources (source.zip)."
            exit 1
          fi

      - name: Build Android Native Runtime (ARM64)
        run: |
          mkdir -p build/runtime
          cmake -S ports/android/runtime -B build/runtime -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build/runtime oot3d_native_game

      - name: Compile Real Title Shared Library (AOT)
        run: |
          if [ -d "title-source" ] && [ "$(ls -A title-source)" ]; then
            echo "Compiling structural game code shards into true AOT binary..."
            mkdir -p build/title
            cmake -S ports/android/native -B build/native_title -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release \
              -DTRIAEVUM_BUILD_TITLE=1 \
              -DTRIAEVUM_TRANSLATED_TITLE_DIR="$(pwd)/title-source"
            ninja -C build/native_title triaevum_android_title
            cp build/native_title/libtriaevum_title_aot.so build/title/libtriaevum_title_aot.so
          else
            echo "Skipping true AOT library build: title-source directory is missing or empty."
          fi

      - name: Prepare and Stage Native Libraries
        run: |
          mkdir -p build/title_stub
          LLVM_DIR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$LLVM_DIR/aarch64-linux-android29-clang"
          if [ ! -f "build/title/libtriaevum_title_aot.so" ]; then
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && { [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "${{ inputs.publish_release }}" = "true" ]; }; then
              echo "::error::Refusing to package a publishable build without the real whole-AOT title module."
              exit 1
            fi
            echo "::warning::Using placeholder AOT stub for non-publishing validation only; this APK is not playable."
            cat << 'EOF' > build/title_stub/triaevum_title_stub.c
            #include <stdint.h>
            __attribute__((visibility("default"))) uint32_t TriAevumTitlePluginVersion(void) { return 1; }
            __attribute__((visibility("default"))) int TriAevumTitlePluginInit(void* host) { (void)host; return 0; }
          EOF
            $CLANG -shared -fPIC -O2 -Wl,-z,max-page-size=16384 \
              build/title_stub/triaevum_title_stub.c \
              -o build/title_stub/libtriaevum_title_aot.so
            TITLE_MODULE="$(pwd)/build/title_stub/libtriaevum_title_aot.so"
          else
            echo "Using genuinely compiled whole-AOT game module."
            TITLE_MODULE="$(pwd)/build/title/libtriaevum_title_aot.so"
          fi
          python3 tools/android/stage_native_app.py \
            --runtime-build build/runtime \
            --title-module "$TITLE_MODULE" \
            --ndk "$ANDROID_NDK_ROOT" \
            --output build/staged_native_libs

      - name: Configure stable Android release signing
        id: signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.TRIAEVUM_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.TRIAEVUM_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.TRIAEVUM_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.TRIAEVUM_RELEASE_KEY_PASSWORD }}
        run: |
          values=(
            "$ANDROID_RELEASE_KEYSTORE_BASE64"
            "$ANDROID_RELEASE_STORE_PASSWORD"
            "$ANDROID_RELEASE_KEY_ALIAS"
            "$ANDROID_RELEASE_KEY_PASSWORD"
          )
          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 4 ]; then
            key_dir="$RUNNER_TEMP/triaevum-release-signing"
            mkdir -p "$key_dir"
            key_file="$key_dir/release.jks"
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_file"
            chmod 600 "$key_file"
            keytool -list -keystore "$key_file" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
            echo "TRIAEVUM_RELEASE_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"
            echo "TRIAEVUM_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TRIAEVUM_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TRIAEVUM_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing configured."
          elif [ "$present" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing secrets are not configured. A debug-signed validation APK will be uploaded as an artifact, but no GitHub Release will be published."
          else
            echo "::error::Release signing is partially configured. Set all four TRIAEVUM_RELEASE_* secrets."
            exit 1
          fi

      - name: Build Android Controls & APK
        run: |
          chmod +x ports/android/gradlew
          ports/android/gradlew -p ports/android :controls:assembleDebug :controls:testDebugUnitTest --console=plain
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            ports/android/gradlew -p ports/android :app:assembleRelease \
              -PtriaevumSdlSource="$(pwd)/build/runtime/_deps/sdl2-src" \
              -PtriaevumNativeStage="$(pwd)/build/staged_native_libs" \
              -PtriaevumVersionCode="$GITHUB_RUN_NUMBER" \
              -PtriaevumVersionName="0.1.$GITHUB_RUN_NUMBER" \
              --console=plain
          else
            ports/android/gradlew -p ports/android :app:assembleDebug \
              -PtriaevumSdlSource="$(pwd)/build/runtime/_deps/sdl2-src" \
              -PtriaevumNativeStage="$(pwd)/build/staged_native_libs" \
              -PtriaevumVersionCode="$GITHUB_RUN_NUMBER" \
              -PtriaevumVersionName="0.1.$GITHUB_RUN_NUMBER" \
              --console=plain
          fi

      - name: Package Android APK artifact
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK_SOURCE="ports/android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_SOURCE="ports/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -f "$APK_SOURCE" ]; then
            cp "$APK_SOURCE" "dist/TriAevum-Oot3D-Android-arm64-v8a.apk"
            ls -lh dist/TriAevum-Oot3D-Android-arm64-v8a.apk
          else
            echo "Error: APK not found at $APK_SOURCE"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriAevum-Oot3D-Android-arm64-v8a
          path: dist/TriAevum-Oot3D-Android-arm64-v8a.apk
          if-no-files-found: error

      - name: Confirm main branch has not moved
        id: freshness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping release from stale commit $GITHUB_SHA; main is now $current_main."
          else
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Release Tag
        id: release_info
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.signing.outputs.enabled == 'true' && steps.freshness.outputs.is_current != 'false' && steps.freshness.outputs.is_current != 'false'
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.signing.outputs.enabled == 'true'
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release_info.outputs.tag, 'alpha') || contains(steps.release_info.outputs.tag, 'beta') }}
          files: dist/TriAevum-Oot3D-Android-arm64-v8a.apk
          generate_release_notes: true
          body: |
            ### TriAevum Android Native Release (${{ steps.release_info.outputs.tag }})

            - **Platform**: Android ARM64
            - **Build**: ${{ github.run_number }}
            - **Source commit**: ${{ github.sha }}
            - Published automatically after a successful Android build.
